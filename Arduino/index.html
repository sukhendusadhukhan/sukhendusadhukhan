<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>IEM Arduino IoT Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #101820,
      #182b3a
    );

  color: white;

  min-height: 100vh;

  padding: 20px;
}

.container {

  max-width: 900px;

  margin: auto;
}

h1 {

  text-align: center;

  margin-bottom: 5px;
}

.subtitle {

  text-align: center;

  opacity: 0.7;

  margin-bottom: 25px;
}

/* SENSOR GRID */

.sensor-grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 15px;

  margin-bottom: 20px;
}

.sensor {

  background: #1e3344;

  border-radius: 15px;

  padding: 20px;

  text-align: center;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.3);
}

.sensor-title {

  font-size: 15px;

  opacity: 0.7;

  margin-bottom: 10px;
}

.sensor-value {

  font-size: 32px;

  font-weight: bold;
}

.unit {

  font-size: 15px;

  opacity: 0.7;
}

/* CONTROL */

.panel {

  background: #1e3344;

  border-radius: 15px;

  padding: 25px;

  margin-top: 20px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.3);
}

.panel h2 {

  margin-top: 0;

  text-align: center;
}

/* SWITCH */

.control-row {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 15px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,0.1);
}

.switch {

  position: relative;

  width: 60px;

  height: 32px;
}

.switch input {

  display: none;
}

.slider {

  position: absolute;

  cursor: pointer;

  inset: 0;

  background: #555;

  border-radius: 30px;

  transition: 0.2s;
}

.slider:before {

  content: "";

  position: absolute;

  width: 24px;

  height: 24px;

  left: 4px;

  top: 4px;

  background: white;

  border-radius: 50%;

  transition: 0.2s;
}

input:checked + .slider {

  background: #2196f3;
}

input:checked + .slider:before {

  transform:
    translateX(28px);
}

/* SERVO */

.servo-value {

  text-align: center;

  font-size: 28px;

  margin: 15px;
}

input[type="range"] {

  width: 100%;
}

button {

  display: block;

  margin: 15px auto 0;

  padding: 12px 35px;

  border: none;

  border-radius: 8px;

  background: #2196f3;

  color: white;

  font-size: 16px;

  cursor: pointer;
}

button:active {

  transform: scale(0.97);
}

/* STATUS */

.status {

  text-align: center;

  margin-top: 20px;

  font-size: 14px;

  opacity: 0.7;
}

/* MOBILE */

@media(max-width:600px) {

  .sensor-grid {

    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>

<div class="container">

<h1>
IEM Arduino UNO R4 WiFi
</h1>

<div class="subtitle">
Smart Local IoT Dashboard
</div>


<!-- ================= SENSOR DATA ================= -->

<div class="sensor-grid">


<div class="sensor">

<div class="sensor-title">
🌡 TEMPERATURE
</div>

<div class="sensor-value"
     id="temperature">

--.-

</div>

<div class="unit">
°C
</div>

</div>


<div class="sensor">

<div class="sensor-title">
💧 HUMIDITY
</div>

<div class="sensor-value"
     id="humidity">

--.-

</div>

<div class="unit">
%
</div>

</div>


<div class="sensor">

<div class="sensor-title">
📏 DISTANCE
</div>

<div class="sensor-value"
     id="distance">

--.-

</div>

<div class="unit">
cm
</div>

</div>

</div>


<!-- ================= LED CONTROL ================= -->

<div class="panel">

<h2>
💡 LED CONTROL
</h2>


<div class="control-row">

<span>
🔴 Red LED
</span>

<label class="switch">

<input
type="checkbox"
id="redSwitch"
onchange="setRed(this.checked)"
>

<span class="slider"></span>

</label>

</div>


<div class="control-row">

<span>
🟢 Green LED
</span>

<label class="switch">

<input
type="checkbox"
id="greenSwitch"
onchange="setGreen(this.checked)"
>

<span class="slider"></span>

</label>

</div>

</div>


<!-- ================= SERVO ================= -->

<div class="panel">

<h2>
⚙️ SERVO CONTROL
</h2>

<div class="servo-value">

<span id="servoAngle">
0
</span>°

</div>

<input
type="range"
id="servoSlider"
min="0"
max="180"
value="0"
oninput="showServoAngle()"
>

<button onclick="setServo()">

SET SERVO ANGLE

</button>

</div>


<div class="status"
     id="status">

Connecting to Arduino...

</div>

</div>


<script>


// =====================================================
// ARDUINO ADDRESS
// =====================================================

const ARDUINO =
"http://192.168.0.134";


// =====================================================
// SENSOR DATA
// =====================================================

async function updateSensors()
{

  try {

    const response =
      await fetch(
        ARDUINO + "/sensors",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();


    document.getElementById(
      "temperature"
    ).textContent =
      data.temperature.toFixed(1);


    document.getElementById(
      "humidity"
    ).textContent =
      data.humidity.toFixed(1);


    document.getElementById(
      "distance"
    ).textContent =
      data.distance.toFixed(1);


    document.getElementById(
      "status"
    ).textContent =
      "● Arduino connected";

  }

  catch(error) {

    document.getElementById(
      "status"
    ).textContent =
      "● Arduino disconnected";

  }

}


// =====================================================
// RED LED
// =====================================================

async function setRed(state)
{

  const command =
    state
    ? "/red/on"
    : "/red/off";

  try {

    await fetch(
      ARDUINO + command,
      {
        cache: "no-store"
      }
    );

  }

  catch(error) {

    console.log(error);

  }

}


// =====================================================
// GREEN LED
// =====================================================

async function setGreen(state)
{

  const command =
    state
    ? "/green/on"
    : "/green/off";

  try {

    await fetch(
      ARDUINO + command,
      {
        cache: "no-store"
      }
    );

  }

  catch(error) {

    console.log(error);

  }

}


// =====================================================
// SERVO DISPLAY
// =====================================================

function showServoAngle()
{

  const angle =
    document.getElementById(
      "servoSlider"
    ).value;

  document.getElementById(
    "servoAngle"
  ).textContent =
    angle;

}


// =====================================================
// SET SERVO
// =====================================================

async function setServo()
{

  const angle =
    document.getElementById(
      "servoSlider"
    ).value;


  try {

    await fetch(
      ARDUINO +
      "/servo?angle=" +
      angle,
      {
        cache: "no-store"
      }
    );

  }

  catch(error) {

    console.log(error);

  }

}


// =====================================================
// LIVE SENSOR UPDATE
// =====================================================

// Only SENSOR information is polled.
// LED and SERVO controls are NEVER touched here.

setInterval(
  updateSensors,
  300
);


// Initial reading

updateSensors();

</script>

</body>

</html>
