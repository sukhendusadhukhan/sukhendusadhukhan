<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Arduino IoT Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 18px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin-top: 7px;
    color: #94a3b8;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
}

.card-title {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.distance {
    text-align: center;
    font-size: 55px;
    font-weight: bold;
}

.unit {
    text-align: center;
    color: #94a3b8;
}

.status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.status-row:last-child {
    border-bottom: none;
}

.status-name {
    font-size: 17px;
}

.status-value {
    font-weight: bold;
}

.on {
    color: #22c55e;
}

.off {
    color: #64748b;
}

.servo-value {
    color: #38bdf8;
}


/* =========================
   CONTROL BUTTONS
   ========================= */

.control-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: white;
}

.auto-button {
    background: #2563eb;
}

.manual-button {
    background: #7c3aed;
}

.red-button {
    background: #dc2626;
}

.green-button {
    background: #16a34a;
}

.gray-button {
    background: #475569;
}

.servo-button {
    background: #0284c7;
}

button:active {
    transform: scale(0.97);
}

.control-label {
    margin: 15px 0 8px 0;
    color: #cbd5e1;
}


/* =========================
   MODE DISPLAY
   ========================= */

.mode-display {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    margin-bottom: 15px;
}

.auto-mode {
    color: #22c55e;
}

.manual-mode {
    color: #c084fc;
}


/* =========================
   CONNECTION
   ========================= */

.connection {
    text-align: center;
    font-weight: bold;
}

.connected {
    color: #22c55e;
}

.disconnected {
    color: #ef4444;
}


/* =========================
   FOOTER
   ========================= */

.footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    margin-top: 20px;
}

</style>

</head>


<body>


<div class="container">


<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<div class="header">

    <h1>
        🤖 Arduino IoT
    </h1>

    <p>
        UNO R4 WiFi • Firebase
    </p>

</div>



<!-- ================================================= -->
<!-- DISTANCE -->
<!-- ================================================= -->

<div class="card">

    <div class="card-title">
        Ultrasonic Distance
    </div>

    <div class="distance">

        <span id="distance">
            --
        </span>

    </div>

    <div class="unit">
        centimetres
    </div>

</div>



<!-- ================================================= -->
<!-- HARDWARE STATUS -->
<!-- ================================================= -->

<div class="card">

    <div class="card-title">
        Hardware Status
    </div>


    <div class="status-row">

        <div class="status-name">
            🔴 Red LED
        </div>

        <div
            id="redLED"
            class="status-value">

            --

        </div>

    </div>


    <div class="status-row">

        <div class="status-name">
            🟢 Green LED
        </div>

        <div
            id="greenLED"
            class="status-value">

            --

        </div>

    </div>


    <div class="status-row">

        <div class="status-name">
            ⚙️ Servo
        </div>

        <div
            id="servo"
            class="status-value servo-value">

            --°

        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- CONTROL -->
<!-- ================================================= -->

<div class="card">

    <div class="card-title">
        Remote Control
    </div>


    <!-- MODE -->

    <div
        id="modeDisplay"
        class="mode-display">

        MODE: --

    </div>


    <div class="control-row">

        <button
            class="auto-button"
            onclick="setMode('AUTO')">

            🟢 AUTO

        </button>


        <button
            class="manual-button"
            onclick="setMode('MANUAL')">

            🔵 MANUAL

        </button>

    </div>


    <!-- SERVO -->

    <div class="control-label">
        ⚙️ Servo Position
    </div>

    <div class="control-row">

        <button
            class="servo-button"
            onclick="setServo(0)">

            0°

        </button>


        <button
            class="servo-button"
            onclick="setServo(90)">

            90°

        </button>

    </div>


    <!-- RED LED -->

    <div class="control-label">
        🔴 Red LED
    </div>

    <div class="control-row">

        <button
            class="red-button"
            onclick="setRed(true)">

            ON

        </button>


        <button
            class="gray-button"
            onclick="setRed(false)">

            OFF

        </button>

    </div>


    <!-- GREEN LED -->

    <div class="control-label">
        🟢 Green LED
    </div>

    <div class="control-row">

        <button
            class="green-button"
            onclick="setGreen(true)">

            ON

        </button>


        <button
            class="gray-button"
            onclick="setGreen(false)">

            OFF

        </button>

    </div>

</div>



<!-- ================================================= -->
<!-- CONNECTION -->
<!-- ================================================= -->

<div class="card">

    <div class="card-title">
        Cloud Connection
    </div>

    <div
        id="connection"
        class="connection">

        ● CONNECTING...

    </div>

</div>


<div class="footer">

    IEM • Arduino IoT Demonstration

</div>


</div>



<!-- ================================================= -->
<!-- FIREBASE -->
<!-- ================================================= -->

<script type="module">


// =====================================================
// IMPORT FIREBASE
// =====================================================

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue,
    set
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


// =====================================================
// FIREBASE CONFIGURATION
// =====================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDDpj3yMSQp-qXpxovh2SDSnhqHT68-Y0k",

    authDomain:
        "fir-c5299.firebaseapp.com",

    databaseURL:
        "https://fir-c5299.firebaseio.com",

    projectId:
        "fir-c5299",

    storageBucket:
        "fir-c5299.appspot.com",

    messagingSenderId:
        "112949129990",

    appId:
        "1:112949129990:web:4a2ba9d13b0260c23be487",

    measurementId:
        "G-JYQV2VPZXT"
};


// =====================================================
// INITIALIZE
// =====================================================

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


// =====================================================
// READ DISTANCE
// =====================================================

const distanceRef =
    ref(
        db,
        "Arduino/sensor/distance"
    );


onValue(
    distanceRef,
    (snapshot) => {

        const value =
            snapshot.val();

        if (value !== null) {

            document
                .getElementById("distance")
                .innerText =
                Number(value).toFixed(2);

        }

    }
);


// =====================================================
// READ RED LED
// =====================================================

const redRef =
    ref(
        db,
        "Arduino/output/redLED"
    );


onValue(
    redRef,
    (snapshot) => {

        const value =
            snapshot.val();

        const element =
            document
                .getElementById("redLED");


        element.innerText =
            value ? "ON" : "OFF";


        element.className =
            value
                ? "status-value on"
                : "status-value off";

    }
);


// =====================================================
// READ GREEN LED
// =====================================================

const greenRef =
    ref(
        db,
        "Arduino/output/greenLED"
    );


onValue(
    greenRef,
    (snapshot) => {

        const value =
            snapshot.val();

        const element =
            document
                .getElementById("greenLED");


        element.innerText =
            value ? "ON" : "OFF";


        element.className =
            value
                ? "status-value on"
                : "status-value off";

    }
);


// =====================================================
// READ SERVO
// =====================================================

const servoRef =
    ref(
        db,
        "Arduino/output/servo"
    );


onValue(
    servoRef,
    (snapshot) => {

        const value =
            snapshot.val();

        document
            .getElementById("servo")
            .innerText =
            value + "°";

    }
);


// =====================================================
// READ MODE
// =====================================================

const modeRef =
    ref(
        db,
        "Arduino/control/mode"
    );


onValue(
    modeRef,
    (snapshot) => {

        const value =
            snapshot.val();

        const element =
            document
                .getElementById("modeDisplay");


        if (value === null) {

            element.innerText =
                "MODE: AUTO";

            element.className =
                "mode-display auto-mode";

            return;
        }


        element.innerText =
            "MODE: " + value;


        if (value === "AUTO") {

            element.className =
                "mode-display auto-mode";

        }

        else {

            element.className =
                "mode-display manual-mode";

        }

    }
);


// =====================================================
// FIREBASE CONNECTION
// =====================================================

const connectedRef =
    ref(
        db,
        ".info/connected"
    );


onValue(
    connectedRef,
    (snapshot) => {

        const connected =
            snapshot.val();

        const element =
            document
                .getElementById("connection");


        if (connected) {

            element.innerText =
                "● LIVE — CONNECTED";

            element.className =
                "connection connected";

        }

        else {

            element.innerText =
                "● OFFLINE";

            element.className =
                "connection disconnected";

        }

    }
);


// =====================================================
// WRITE MODE
// =====================================================

window.setMode = function(mode)
{

    set(
        ref(
            db,
            "Arduino/control/mode"
        ),
        mode
    );

};


// =====================================================
// WRITE SERVO
// =====================================================

window.setServo = function(angle)
{

    set(
        ref(
            db,
            "Arduino/control/servo"
        ),
        angle
    );

};


// =====================================================
// WRITE RED LED
// =====================================================

window.setRed = function(state)
{

    set(
        ref(
            db,
            "Arduino/control/redLED"
        ),
        state
    );

};


// =====================================================
// WRITE GREEN LED
// =====================================================

window.setGreen = function(state)
{

    set(
        ref(
            db,
            "Arduino/control/greenLED"
        ),
        state
    );

};


</script>


</body>

</html>
